<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأخبار والإعلانات المدرسية | مدرسة سيدي إبراهيم الرائدة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header class="main-header">
        <div class="container">
            <nav class="navbar">
                <a href="index.html" class="brand-logo">
                    <img src="assets/images/logo.jpg" alt="Logo" onerror="this.src='assets/images/hero.jpg'">
                    <div class="brand-title">
                        <span class="brand-name">مدرسة سيدي إبراهيم الرائدة</span>
                        <span class="brand-sub">Sidi Ibrahim Pioneer School</span>
                    </div>
                </a>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">الرئيسية</a></li>
                    <li><a href="about.html" class="nav-link">من نحن والإدارة</a></li>
                    <li><a href="gallery.html" class="nav-link">الأنشطة والمعرض</a></li>
                    <li><a href="news.html" class="nav-link active">الأخبار والإعلانات</a></li>
                    <li><a href="contact.html" class="nav-link">اتصل بنا</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div style="background: linear-gradient(135deg, var(--primary), var(--dark)); color: #FFF; padding: 3.5rem 0; text-align: center; margin-bottom: 3rem;">
        <div class="container">
            <h1 style="font-size: 2.5rem; font-weight: 900; margin-bottom: 0.5rem;">الأخبار والإعلانات المدرسية</h1>
            <p style="font-size: 1.1rem; color: #CBD5E1;">منبر الإعلانات الرسمية ومستجدات مدرسة سيدي إبراهيم الرائدة</p>
        </div>
    </div>

    <div class="container" style="margin-bottom: 4rem;">
        
        <!-- شريط البحث والتصفية المباشر -->
        <div style="background: #FFF; padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); margin-bottom: 2.5rem;">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;">
                <div style="flex-grow: 1; position: relative;">
                    <input type="text" id="newsSearchInput" placeholder="ابحث في الأخبار والقرارات..." class="form-control" style="padding-right: 2.5rem;">
                    <i class="fas fa-search" style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: var(--gray-text);"></i>
                </div>
                
                <select id="newsCategorySelect" class="form-control" style="width: auto; min-width: 180px;">
                    <option value="">جميع الفئات</option>
                    <option value="الأنشطة المدرسية">الأنشطة المدرسية</option>
                    <option value="تكريم وتفوق">تكريم وتفوق</option>
                    <option value="إعلانات الإدارة">إعلانات الإدارة</option>
                    <option value="أخبار عامة">أخبار عامة</option>
                </select>
            </div>
        </div>

        <!-- حاوية المقالات الديناميكية -->
        <div class="grid grid-3" id="dynamicNewsPostsGrid">
            <!-- يتم رندر المقالات ديناميكياً والتخزين الدائم من LocalStorage -->
        </div>

    </div>

    <footer class="main-footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 جميع الحقوق محفوظة - <strong>مدرسة سيدي إبراهيم الرائدة</strong></p>
            </div>
        </div>
    </footer>

    <script src="assets/js/db.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
