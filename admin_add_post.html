<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مقال جديد | مدرسة سيدي إبراهيم الرائدة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background: #F1F5F9;">

<div class="admin-layout">
    
    <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
            <img src="assets/images/logo.jpg" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%;" onerror="this.style.display='none'">
            <div>
                <h4 style="color: #FFF; font-size: 1.1rem;">سيدي إبراهيم</h4>
                <span style="font-size: 0.75rem; color: var(--secondary);">لوحة التحكم والإدارة</span>
            </div>
        </div>

        <nav class="admin-nav">
            <a href="admin_dashboard.html" class="admin-nav-item">
                <i class="fas fa-th-large"></i> الرئيسية والإحصائيات
            </a>
            <a href="admin_add_post.html" class="admin-nav-item active">
                <i class="fas fa-plus-circle"></i> إضافة مقال / إعلان جديد
            </a>
            <a href="index.html" target="_blank" class="admin-nav-item">
                <i class="fas fa-external-link-alt"></i> معاينة الموقع العام
            </a>
            <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <a href="admin_login.html" class="admin-nav-item" style="color: #F87171;">
                    <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                </a>
            </div>
        </nav>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <div>
                <h3 style="font-size: 1.25rem; color: var(--primary); font-weight: 800;">إضافة مقال جديد للمدرسة</h3>
            </div>
        </header>

        <div class="admin-content">
            
            <div style="background: #FFF; padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); max-width: 900px; margin: 0 auto;">
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
                    <h2 style="font-size: 1.5rem; color: var(--primary); font-weight: 800;">
                        <i class="fas fa-edit" style="color: var(--secondary);"></i> إضافة مقال / إعلان جديد
                    </h2>
                    <a href="admin_dashboard.html" class="btn btn-outline" style="color: var(--dark-muted); border-color: var(--border-color);">
                        <i class="fas fa-arrow-right"></i> إلغاء ورجوع
                    </a>
                </div>

                <form id="addPostForm">
                    
                    <div class="form-group">
                        <label class="form-label">عنوان المقال *</label>
                        <input type="text" id="postTitleInput" required class="form-control" placeholder="أدخل عنوان المقال أو الإعلان">
                    </div>

                    <div class="grid grid-2" style="gap: 1.2rem;">
                        <div class="form-group">
                            <label class="form-label">الفئة / التصنيف *</label>
                            <select id="postCategoryInput" class="form-control">
                                <option value="أخبار عامة">أخبار عامة</option>
                                <option value="الأنشطة المدرسية">الأنشطة المدرسية</option>
                                <option value="تكريم وتفوق">تكريم وتفوق</option>
                                <option value="إعلانات الإدارة">إعلانات الإدارة</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">حالة النشر *</label>
                            <select class="form-control">
                                <option value="published">منشور مباشرة</option>
                                <option value="draft">مسودة</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">ملخص قصير عن المقال</label>
                        <textarea id="postExcerptInput" class="form-control" style="min-height: 80px;" placeholder="سطران يشرحان باختصار مضمون الخبر..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">المحتوى الكامل للمقال *</label>
                        <textarea id="postContentInput" required class="form-control" style="min-height: 200px;" placeholder="اكتب التفاصيل الكاملة للمقال هنا..."></textarea>
                    </div>

                    <div class="form-group" style="background: var(--light-bg); padding: 1.5rem; border-radius: var(--radius-sm); border: 1px dashed var(--border-color);">
                        <label class="form-label"><i class="fas fa-image" style="color: var(--secondary);"></i> رفع الصورة البارزة (Featured Image Upload)</label>
                        <input type="file" id="postImageInput" accept="image/*" class="form-control" style="background: #FFF;">
                        <div style="margin-top: 1rem;">
                            <img id="postImagePreview" src="#" alt="معاينة الصورة" style="max-height: 160px; border-radius: var(--radius-sm); display: none;">
                        </div>
                    </div>

                    <div style="margin-top: 2rem;">
                        <button type="submit" class="btn btn-primary" style="padding: 1rem 2rem;">
                            <i class="fas fa-check-circle"></i> حفظ ونشر المقال الآن
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<script src="assets/js/db.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
